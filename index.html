<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>莒優探索館</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b2b;color:#fff8eb;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;touch-action:none}#hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:8px}#hud>*{pointer-events:auto} .plate{background:#15243be8;border:1px solid #b99a63;border-radius:12px;padding:10px 16px;box-shadow:0 8px 24px #0005}small{display:block;color:#d9c39b}button{font:inherit;color:#fff8eb;background:#263d50;border:1px solid #b99a63;border-radius:8px;padding:9px 12px;cursor:pointer}button:hover{background:#476c70}#nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px;max-width:98vw}#note{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);text-align:center;background:#132136e8;padding:8px 14px;border-radius:9px;max-width:92vw;width:max-content;pointer-events:none}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#101b2b;z-index:4;padding:24px}#vr{min-width:100px} @media(max-width:600px){.plate{padding:7px 10px}#nav button{font-size:12px;padding:8px}#hud{font-size:13px}}
.info-open #note{visibility:hidden}.info-open #nav{opacity:.45}.info-open #hud .plate{opacity:.55}@media(max-width:600px){#hud{gap:4px}#hud button{font-size:12px;padding:6px}#hud>div:last-child{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}}#dialog[hidden]{display:none}#dialog{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#09131dcc;backdrop-filter:blur(5px);padding:20px;overflow:auto}.detail-card{position:relative;width:min(530px,100%);max-height:calc(100dvh - 40px);overflow:auto;background:#fcf5e5;color:#243342;border-radius:20px;padding:clamp(20px,4vw,36px);box-shadow:0 20px 80px #0007;border:1px solid #c0a171}.detail-card header{padding:0 32px 12px 0;border-bottom:1px solid #d9c7a2}.detail-card small{color:#876b40;font-size:12px;letter-spacing:.11em}.detail-card h2{font-size:clamp(21px,4vw,30px);margin:7px 0 0;line-height:1.35}.detail-card p{white-space:pre-line;font-size:clamp(17px,3vw,22px);line-height:1.8;margin:20px 0}.detail-card .fault-art{display:block;width:100%;height:auto;max-height:31vh;object-fit:contain;margin:16px auto 0;border-radius:10px}.detail-card .close-card{position:absolute;right:14px;top:14px;width:36px;height:36px;border:0;border-radius:50%;padding:0;background:#e9e0ca;color:#344656;font-size:24px}.detail-card footer{display:flex;flex-wrap:wrap;gap:10px}.detail-card footer button{flex:1;min-width:105px;min-height:48px;border:1px solid #bba47a;background:#fff9ec;color:#263b45;font-weight:600}.detail-card footer .continue{background:#285b53;color:#fff;border-color:#285b53}.detail-card footer button:hover{background:#d6e7df;color:#193e37}.info-open #nav,.info-open #hud{visibility:hidden}#note{font-size:13px;opacity:.92;max-width:70vw}@media(max-width:600px){#note{font-size:12px;max-width:65vw;bottom:65px}.detail-card p{line-height:1.6}} </style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><div id="loading">正在開啟探索館…<small>需要網路連線以載入 3D 引擎</small></div><div id="hud"><div class="plate"><b>莒優探索館 <small style="display:inline;color:#b8a787">V9</small></b><small id="progress">探索之星 0 / 2</small></div><div><button id="help" aria-label="開啟或收合任務說明">說明／收合</button> <button id="vr">進入 VR</button> <button id="reset">重來</button></div></div><div id="dialog" role="dialog" aria-modal="true" hidden></div><div id="note">方向鍵／WASD 移動，拖曳環顧，點選展品或地面光圈。</div><div id="nav"><button data-go="0">主展館</button><button data-go="1">星光記憶挑戰</button><button data-go="2">天秤挑戰</button></div><script type="module" src="museum.js?v=9"></script><script>setTimeout(()=>{if(document.getElementById('loading'))document.getElementById('loading').innerHTML='無法載入 3D 引擎。<br>請確認網路連線，並使用 Chrome、Safari 或 Quest Browser 重新開啟。'},18000)</script></body></html>
